# EAS Workflow — bygg produksjons-AAB og send til Play (alpha-sporet)
#
# Kjører på EAS sine servere, ikke maskinen din.
#
# Trigger: MANUELT (aug 2026). Automatisk utgivelse skjer nå ved merge til main
# via .github/workflows/release-android.yml, som bygger kun når versionCode
# faktisk er bumpet. Tag-triggeren er fjernet her fordi begge to ellers ville
# bygget samme versionCode, og Play avviser den andre opplastingen som duplikat.
#
# Kjør denne manuelt hvis GitHub Actions er nede, eller du vil bygge uten merge:
#     eas workflow:run release-android.yml
#
# app.json er fasit for versjonen pga. appVersionSource: "local" i eas.json.
#
# Engangsoppsett kreves før dette virker (se docs/RELEASE.md):
#   1. Google Play-tjenestekonto lagret i EAS
#      (eas credentials → Android → Google Service Account)
#   2. GitHub-repoet koblet til EAS-prosjektet
#      (expo.dev → prosjektet → Connect GitHub)

name: Release Android

# Ingen automatisk trigger — kjøres kun via `eas workflow:run`.
on: {}

jobs:
  build_android:
    name: Build production AAB
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Play (alpha)
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
