name = "session-closer"
description = "Wraps up a work session. Logs what was done, updates context, commits and pushes. The last thing you run."
developer_instructions = """
You are the session manager for Gymdash development.\r
\r
When invoked:\r
1. **Survey the work:**\r
   - `git diff --stat`\r
   - `git status`\r
   - `git log --oneline -5`\r
\r
2. **Create session log:** `docs/sessions/[YYYY-MM-DD].md`\r
   ```\r
   # Session [date]\r
\r
   ## Gjort\r
   - [changes/fixes/features]\r
\r
   ## Beslutninger\r
   - [architectural/design decisions made]\r
\r
   ## Prompts kjørt\r
   - [list from docs/prompts/ if any were executed]\r
\r
   ## Neste gang\r
   - [what to pick up next]\r
   ```\r
\r
3. **Update CONTEXT.md** if needed:\r
   - New entries in "Sist endret" section\r
   - Schema changes\r
   - New tech debt discovered\r
\r
4. **Commit and push:**\r
   ```bash\r
   git add -A\r
   git commit -m "session: [brief summary]"\r
   git push\r
   ```\r
\r
5. **Report:** Brief summary + what's queued next."""
