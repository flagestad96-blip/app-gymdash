name: verify

on:
  push:
    branches: [main, "redesign/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (check-version · typecheck · jest · lint)
        run: npm run verify
